{% extends "base.html" %}
{% block content %}
    <div class="container pt-4">
        <h1>Enviar resultados</h1>
        <form action="{{ url_for('upload_file') }}" method="post" enctype="multipart/form-data">
            <label for="hash_sha256">Hash SHA-256 da amostra</label>
            <input id="hash_sha256" name="hash_sha256" required pattern="[a-fA-F0-9]{64}" maxlength="64">
            <label for="file">Arquivo ZIP dos resultados</label>
            <input id="file" type="file" name="file" accept=".zip" required>
            <button type="submit">Enviar arquivo</button>
        </form>
    </div>
{% endblock %}
