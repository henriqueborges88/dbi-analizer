<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='Bootstrap5/css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='DataTables/datatables.min.css') }}">

    <script src="{{ url_for('static', filename='DataTables/datatables.min.js') }}"></script>
    <script src="{{ url_for('static', filename='Bootstrap5/js/bootstrap.bundle.min.js') }}"></script>

    <title>dbi-analyzer</title>
    <style>
        .sidebar {
            height: 100vh;
            overflow-y: auto;
            width: 250px;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #f8f9fa;
            padding-top: 20px;
        }
        .sidebar a {
            padding: 15px;
            text-decoration: none;
            font-size: 18px;
            color: #333;
            display: block;
        }
        .sidebar a:hover {
            background-color: #ddd;
        }
        .content {
            margin-left: 260px;
            padding: 20px;
        }
        .frequency-chart {
            max-height: 24rem;
            overflow-y: auto;
        }
        .frequency-row {
            display: grid;
            grid-template-columns: minmax(6rem, 1fr) 2fr auto;
            align-items: center;
            gap: 0.5rem;
            margin: 0.75rem 0;
        }
        .frequency-row label { overflow-wrap: anywhere; }
        .frequency-row progress { width: 100%; }
        @media (max-width: 767px) {
            .sidebar { position: static; width: auto; height: auto; }
            .content { margin-left: 0; padding: 12px; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <a href="{{ url_for('analysis') }}">Análise</a>
        <a href="{{ url_for('sample_list_tools') }}">Amostras</a>
        <a href="{{ url_for('sample_tools') }}">Ferramentas</a>
    </div>

    <div class="content">
        {% block content %}
        {% endblock %}
    </div>


</body>
</html>
